<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>PDPA Data Masking Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>

    <h1 id="page-title">PDPA Data Masking</h1>
    <p><a href="https://github.com/pmipheta/TOC-Project">Source code on GitHub</a></p>

    <form id="mask-form" action="/mask" method="POST">
        <label for="data" class="section-label">Input Mask:</label>

        <textarea name="data" id="data" placeholder="" required>{{ original }}</textarea>
        <br><br>

        <button type="submit" id="submit-btn">Mask Data</button>
        <button type="button" id="load-example-btn" hidden>โหลดตัวอย่าง</button>
    </form>
    <p id="action-status" role="status" aria-live="polite"></p>

    {% if mask_text %}
        <div id="result-section">
            <h2 id="result-title">Mask Data:</h2>
            <p>ผลลัพธ์จากการประมวลผลครั้งล่าสุด</p>
            <textarea id="mask_text" readonly>{{ mask_text }}</textarea>
        </div>
    {% endif %}

</body>
</html>
